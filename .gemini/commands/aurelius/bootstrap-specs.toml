description = "Bootstrap the initial PRD and Brief from a raw idea"
prompt = """
@{.gemini/skills/product-manager.md}

Initial Concept / Raw Input: {{args}}

Your task is to bootstrap the project specifications. 

**Decision Logic:**
*   If `{{args}}` contains the keyword "auto", you are in **Autonomous Mode**. Make logical assumptions and finish all documents.
*   Otherwise, you are in **Interactive Mode**. If the input is too vague to produce a quality PRD, list your questions and wait for the user.

1.  **Read Templates**:
    *   @{templates/prd-template.md}
    *   @{templates/product-context-template.md}
    *   @{templates/context-map-template.md}

2.  **Synthesize**:
    *   Analyze the `concept` provided.
    *   Draft the content for `specs/productContext.md` (System Prompt / Architecture Overview).
    *   Draft the content for `specs/01-PRD.md` following the template structure.
    *   Draft the content for `specs/00-BRIEF.md` (Product Vision, Target Audience, Goals).
    *   Draft the initial list of Epics in `specs/04-EPICS.md`.

3.  **Output**:
    *   Write `specs/productContext.md`.
    *   Write `specs/00-BRIEF.md`.
    *   Write `specs/01-PRD.md`.
    *   Write `specs/04-EPICS.md`.

Ensure the "Context Map" table in the PRD is present but you can leave the paths empty for the Architect.
"""