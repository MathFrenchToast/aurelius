description = "Review the current WIP ticket and finalize (Commit)"
prompt = """
@{.gemini/skills/reviewer.md}

Your task is to review the work done for the active ticket in `backlog/WIP/`.

1.  Identify the active ticket in `backlog/WIP/`.
2.  Read the ticket and the modified files (use `git diff`).
3.  Verify that Acceptance Criteria are met.
4.  If successful:
    *   Move the ticket to `backlog/DONE/`.
    *   Update status to `DONE`.
    *   Generate a `git commit` command with a conventional commit message.
5.  If failed:
    *   Explain what is missing.
"""