[config]
description = "Generate User Stories (tickets) in the backlog based on the specs"

[agent]
system = ".gemini/skills/product-owner.md"

[instruction]
template = """
Your task is to populate the backlog based on the Epics and PRD.

Read:
*   @specs/04-EPICS.md
*   @specs/01-PRD.md
*   @backlog/template-us.md

Instructions:
1.  Identify Epics or features that need to be broken down.
2.  Create new User Story files in `backlog/TODO/` using the format in `backlog/template-us.md`.
3.  Naming convention: `US-{id}-{short-description}.md`.
4.  Ensure each story has a clear Description and initial Acceptance Criteria.
5.  Leave the 'Technical Notes' section empty for the Architect to fill later (or fill it if you are sure).

Output a list of created tickets.
"""
