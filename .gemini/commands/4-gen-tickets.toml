[config]
description = "Generate User Stories (tickets) in the backlog based on the specs"

[agent]
system = ".gemini/skills/product-owner.md"

[instruction]
template = """
Your task is to populate the backlog based on the Epics and PRD.

Read:
*   @specs/04-EPICS.md
*   @specs/01-PRD.md
*   @backlog/template-us.md

Instructions:
1.  **Identify**: Find Epics or features in `specs/04-EPICS.md` that are not yet broken down.
2.  **Extract Rules**: Read the relevant sections in `specs/01-PRD.md` to find the Business Rules associated with these features.
3.  **Create Tickets**: Generate new User Story files in `backlog/TODO/`.
    *   Naming: `US-{id}-{short-description}.md`.
    *   **Description**: Clear user benefit.
    *   **Acceptance Criteria**:
        *   Convert PRD rules into specific test cases.
        *   Include at least one "Happy Path" and one "Error Path".
        *   Example: "Given user has 0 credits, When they click buy, Then show error 'Insufficient funds'".

Output a list of created tickets.
"""