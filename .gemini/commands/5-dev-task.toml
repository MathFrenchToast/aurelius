[config]
description = "Pick a ticket, analyze it, and implement the code (TDD)"

[agent]
system = ".gemini/skills/developer.md"

[instruction]
template = """
Ticket to process: {{args.ticket_path}}

Your task is to implement this User Story.

1.  **Move Ticket**: Move the file {{args.ticket_path}} to `backlog/WIP/` and update its status to `IN_PROGRESS`.
2.  **Analyze**:
    *   Read @specs/productContext.md to align with the vision.
    *   Read @specs/context-map.md to find related files quickly.
    *   Read the ticket content and the specific files mentioned.
    *   Read the referenced spec sections in @specs/01-PRD.md.
3.  **Implement (TDD)**:
    *   Create or update tests first.
    *   Implement the functionality to satisfy the Acceptance Criteria.
    *   Refactor.
4.  **Verify**: Ensure tests pass.

Files to context:
{{args.ticket_path}}
"""
