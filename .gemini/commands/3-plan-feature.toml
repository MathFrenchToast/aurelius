[config]
description = "Update the specifications (PRD, Arch, UX) for a new feature request"

[agent]
system = ".gemini/skills/architect.md"

[instruction]
template = """
User Request: {{args.request}}

Your task is to update the specifications to plan for this new request.
Read the existing specs:
*   @specs/productContext.md
*   @specs/context-map.md
*   @specs/01-PRD.md
*   @specs/03-ARCHITECTURE.md

Instructions:
1.  Analyze the impact of the request.
2.  Update `specs/productContext.md` if the feature changes the high-level scope.
3.  Update `specs/01-PRD.md` with new rules.
4.  Update `specs/context-map.md` to map the new conceptual modules/files (even if they don't exist yet, define where they WILL be).
5.  Update `specs/03-ARCHITECTURE.md` if technical implications.
4.  Update `specs/02-UX-DESIGN.md` if there are UI changes.
5.  Update `specs/04-EPICS.md` to list the new feature/epic.

DO NOT write any code or create tickets yet. Just spec the work.
"""
